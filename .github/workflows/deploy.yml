name: Deploy Valentra to IHS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ayni anda birden fazla FTP mirror calisirsa farkli commitlerin dosyalari
# sunucuda birbirine karisabilir; yuklemeler bu yuzden SIRAYLA.
#
# Yarida KESILMIYOR (23.10.2026). Onceden yeni commit gelince suren
# yukleme iptal ediliyordu: mirror dosyalari tek tek yazdigi icin sunucuda
# yeni ve eski dosyalar karisik kaliyordu (yeni index.php, eski
# haberler.php -> tanimsiz islev) ve site ACILMADI; art arda birlestirmelerde
# hicbir yukleme bitmedi. Simdi suren yukleme biter, siradaki bekler.
# GitHub sirada tek yukleme tutar; bekleyen daha eskiyse yenisi onun
# yerini alir, yani yine en guncel main yuklenir.
concurrency:
  group: valentra-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Yukleme adimi kendi icinde yeniden deniyor (bkz. .github/yukle.sh):
    # degisen dosyalar en kotu ~16 dakika, tam yukleme iki kez 15 dakika.
    # 12 dakika yetmiyordu: bir deploy tam bu yuzden "cancelled" ile
    # kesildi ve sertifika duzeltmesi sunucuya hic gitmedi.
    timeout-minutes: 35

    steps:
      - name: Repository kodlarini al
        uses: actions/checkout@v5
        with:
          # Tum gecmis: yalnizca son yuklemeden bu yana degisen dosyalar
          # gonderiliyor (bkz. .github/yukle.sh).
          fetch-depth: 0

      - name: FTP aracini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Veritabani ayar dosyasini olustur
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p includes

          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          def enc(name):
              return base64.b64encode(
                  os.environ[name].encode("utf-8")
              ).decode("ascii")

          content = f"""<?php
          declare(strict_types=1);

          $dbHost = base64_decode('{enc("DB_HOST")}');
          $dbName = base64_decode('{enc("DB_NAME")}');
          $dbUser = base64_decode('{enc("DB_USERNAME")}');
          $dbPass = base64_decode('{enc("DB_PASSWORD")}');

          try {{
              $pdo = new PDO(
                  "mysql:host={{$dbHost}};dbname={{$dbName}};charset=utf8mb4",
                  $dbUser,
                  $dbPass,
                  [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                      PDO::ATTR_EMULATE_PREPARES => false
                  ]
              );
          }} catch (PDOException $e) {{
              exit('Veritabani baglantisi kurulamadi.');
          }}
          """

          Path("includes/database.php").write_text(
              content,
              encoding="utf-8"
          )
          PY

      - name: IHS sunucusuna yukle
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.FTP_DIRECTORY }}
        # Yarim dosya gorunmuyor (gecici adla yukleyip yeniden adlandirma) ve
        # yalnizca son yuklemeden bu yana degisen dosyalar gidiyor; ayrinti,
        # siralama ve yeniden deneme .github/yukle.sh icinde.
        run: bash .github/yukle.sh
