name: Haber ajani

on:
  schedule:
    # Gunde 5 kez, Turkiye saatiyle 05:20 / 09:20 / 13:20 / 17:20 /
    # 21:20. Cron UTC calisir, Turkiye UTC+3: 02:20 UTC = 05:20 TR.
    #
    # ONCEDEN GUNDE 10'DU. Iki sebeple yariya indirildi:
    #
    # 1. IHS 443'te araliklarla baglanti kabul etmiyor ve her calisma
    #    siteye onlarca istek atiyor. Olcum: 20:07 dustu, 20:11
    #    calisti, 20:17 calisti, 20:26 dustu. Sunucu ayakta (ayni
    #    dakikalarda FTP calisiyor), yani hiz sinirlamasi olasi. Istek
    #    hacmini yariya indirmek bunu sinama imkani da veriyor.
    #
    # 2. Geriye bakis penceresi 30 saate cikti. Dort saatlik aralikta
    #    pencereler fazlasiyla ustuste biniyor; bir calisma kacsa bile
    #    yedi calisma daha ayni araligi tariyor. Ustuste binme bedava:
    #    sitede zaten olan haber modele hic sorulmuyor.
    #
    # Gece 01:20-03:20 arasi atlandi: o saatlerde yeni haber cikmiyor.
    # Sabah 05:20 ise Resmi Gazete'nin erken yayinini yakalamak icin
    # duruyor.
    #
    # Dakika 20: saat basi GitHub'da yogun ve zamanlanmis isler
    # gecikebiliyor.
    - cron: '20 2,6,10,14,18 * * *'
    # Pratik bilgilerin haftalik calismasi kaldirildi (22.10.2026, site
    # sahibinin karari: ajan yalnizca haber ve kose yazisi uretiyor).
    # Panelden "pratik-bilgiler" moduyla elle calistirilabiliyor.
  workflow_dispatch:
    inputs:
      mod:
        description: 'Ne yapilsin'
        type: choice
        default: 'topla'
        options:
          - topla
          - gunluk
          - pratik-bilgiler
          - kose-yazisi
          - kaynak-testi
          - kanun-testi
          - ag-tanisi
      kuru:
        description: 'Kuru calisma (siteye gonderme, sadece ciktiyi goster)'
        type: boolean
        default: false
      saat:
        description: 'Kac saat geriye bakilsin'
        default: '36'
      enfazla:
        description: 'En fazla kac aday islensin (bos: basliklarin paylarinin toplami, 60)'
        default: ''
      aday:
        description: 'kaynak-testi: DB disi aday adresler  (Ad=https://..., Ad=https://...|yol:/bolum/)'
        default: ''
      rg:
        description: 'kaynak-testi: Resmi Gazete okuyucusunu dene (bugun + dun)'
        type: boolean
        default: false
      metin:
        description: 'kaynak-testi: bu adreslerden modele gidecek metni goster (virgulle)'
        default: ''
      evds:
        description: 'kaynak-testi: EVDS sorgusu, site uzerinden (yol ; yol)'
        default: ''
      ham:
        description: 'kaynak-testi: sayfa yapisini ozetle (adres ; adres)'
        default: ''
      konu:
        description: 'topla: yalnizca bu basliklar (spor, politika, dunya, ... virgulle); bos: hepsi'
        default: ''

# Ayni anda iki ajan calismasin; ust uste binerse kopya istek olusur.
concurrency:
  group: valentra-ajan
  cancel-in-progress: false

# Yoneticinin bilmesi gereken sorunlar bu dosyada birikir (ajan/src/
# Bildirim.php ve asagidaki curl adimlari yazar). Son adim dosyayi okuyup
# calismayi KIRMIZI bitirir: GitHub e-posta atar, panel nedeni gosterir.
#
# Eskiden site haftalarca ulasilamaz oldugu halde calismalar yesil
# gorunuyordu; haberler bekliyor ama kimse bilmiyordu.
env:
  AJAN_SORUN_DOSYASI: /tmp/valentra-ajan-sorunlar.txt

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository kodlarini al
        uses: actions/checkout@v5

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, simplexml, json
          coverage: none

      - name: Composer onbellegi
        uses: actions/cache@v4
        with:
          path: ajan/vendor
          key: ajan-vendor-${{ hashFiles('ajan/composer.json') }}
          restore-keys: ajan-vendor-

      # Ajanin calismalar arasi kucuk deposu.
      #
      # Iki sey tasiyor: son basarili yapilandirma (kaynak listesi) ve
      # gonderilemeden kalan haberler. Site ulasilamaz oldugunda ajan
      # bu kopyayla taramaya devam ediyor ve yazdigi haberler
      # kaybolmak yerine burada bekleyip siteye ulasilan ilk
      # calismada gonderiliyor.
      #
      # Anahtara calisma numarasi konuyor ve restore-keys ile en son
      # kayit geri yukleniyor: GitHub onbellegi ayni anahtara ikinci
      # kez YAZMAZ, sabit anahtar kullanilsa depo ilk calismadan sonra
      # hic guncellenmezdi.
      #
      # Geri yukleme ve kayit ayri adimlar: actions/cache'in kendi kaydi
      # yalnizca is BASARILI bittiginde calisiyor. Is kirmizi bitince
      # (ornegin site ulasilamaz oldugunda) bekleyen haberler kaydedilmiyor
      # ve bir sonraki calismaya ulasmiyordu.
      - name: Ajan deposu
        uses: actions/cache/restore@v4
        with:
          path: ajan/onbellek
          key: ajan-depo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ajan-depo-

      - name: Bagimliliklari kur
        working-directory: ajan
        run: composer install --no-interaction --no-progress --prefer-dist

      # PDF'ten metin cikarmak icin pdftotext (poppler).
      #
      # Resmi Gazete'de ekli tablolu Cumhurbaskani Kararlari ve bazi
      # tebligler PDF. Arac yokken PDF'in metni bos cikiyor ve model
      # "sayfa metni alinamadi" deyip tam da aranan mevzuati eliyordu.
      # Kurulum basarisiz olursa is DURMUYOR: ajan araci bulamazsa o
      # adaylari eskisi gibi baslik ve ozetle degerlendiriyor.
      - name: PDF araci kur
        if: inputs.mod != 'ag-tanisi' && inputs.mod != 'kanun-testi'
        run: |
          sudo apt-get install -y -q poppler-utils \
            || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils) \
            || echo "::warning::pdftotext kurulamadi; PDF mevzuat metni okunamayacak."

      # Kaynak testi model cagrisi yapmaz ve siteye hicbir sey yazmaz;
      # yalnizca hangi kaynagin okunabildigini raporlar. Testin burada
      # kosmasi onemli: paylasimli hostingin CA deposu eksik oldugu icin
      # panelden yapilan deneme bazi kaynaklarda yanlislikla SSL hatasi
      # veriyor, ajan ise ayni kaynagi buradan okuyabiliyor.
      # Kanun baglantilari mevzuat.gov.tr'ye gidiyor ve adresler tertip
      # numarasiyla uretiliyor; yanlis tertip bagi sessizce kiriyor.
      - name: Kanun baglantilarini sina
        if: inputs.mod == 'kanun-testi'
        working-directory: ajan
        run: php kaynak_dene.php --kanunlar

      # Baglanan sunucunun dis IP adresini ve baglanti sonucunu yazar.
      #
      # Barindirici 443'teki zaman asimini inceleyebilmek icin IP
      # istedi. GitHub Actions'in sabit IP'si yok, her calisma farkli
      # bir adres aliyor; bu adim "IP + saat + sonuc" uclusunu
      # uretiyor, kayitlarda aranacak olan bu.
      - name: Ag tanisi
        if: inputs.mod == 'ag-tanisi'
        working-directory: ajan
        env:
          VALENTRA_SITE_URL: ${{ secrets.VALENTRA_SITE_URL }}
        run: php ag_tani.php

      - name: Kaynaklari sina
        if: inputs.mod == 'kaynak-testi'
        working-directory: ajan
        env:
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
          # Girdiler ortam degiskeniyle geciyor, betige dogrudan
          # yazilmiyor: adreslerdeki |, & gibi karakterler kabuk
          # komutu olarak yorumlanmasin.
          SAAT:  ${{ inputs.saat || '36' }}
          ADAY:  ${{ inputs.aday }}
          RG:    ${{ inputs.rg }}
          METIN: ${{ inputs.metin }}
          EVDS:  ${{ inputs.evds }}
          HAM:   ${{ inputs.ham }}
        # Aday adresleri once SINANIR, sonra schema.sql'e yazilir.
        # Tersi sira denendi ve listede 32 bozuk adres birikti.
        #
        # --rg ve --metin ayni calismada adaylarla birlikte istenebiliyor;
        # hicbiri verilmezse eskisi gibi butun kaynaklar sinaniyor.
        run: |
          set +e
          durum=0

          if [ "$RG" = "true" ]; then
            php kaynak_dene.php --rg || durum=1
          fi

          if [ -n "$METIN" ]; then
            php kaynak_dene.php --metin="$METIN" || durum=1
          fi

          if [ -n "$ADAY" ]; then
            php kaynak_dene.php --saat="$SAAT" --aday="$ADAY" || durum=1
          fi

          if [ -n "$EVDS" ]; then
            php kaynak_dene.php --evds="$EVDS" || durum=1
          fi

          if [ -n "$HAM" ]; then
            php kaynak_dene.php --ham="$HAM" || durum=1
          fi

          if [ "$RG" != "true" ] && [ -z "$METIN" ] && [ -z "$ADAY" ] && [ -z "$EVDS" ] && [ -z "$HAM" ]; then
            php kaynak_dene.php --saat="$SAAT" || durum=1
          fi

          exit $durum

      # Pratik bilgiler nadiren (yilda birkac kez) degisiyor; haber
      # toplamayla ayni siklikta kosmasi anlamsiz olurdu. Haftada bir
      # zamanlanmis, ayrica panelden elle calistirilabiliyor.
      - name: Pratik bilgileri topla
        if: inputs.mod == 'pratik-bilgiler'
        working-directory: ajan
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:        ${{ secrets.GEMINI_MODEL }}
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
        run: php pratik.php

      - name: Ajani calistir
        if: inputs.mod == 'topla' || inputs.mod == 'gunluk' || inputs.mod == ''
        working-directory: ajan
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          # Model adi degisirse kod duzenlemeye gerek yok: bu secret'i
          # ekleyip istedigin model adini yazman yeterli.
          GEMINI_MODEL:        ${{ secrets.GEMINI_MODEL }}
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
          # Ortam degiskeniyle: betige dogrudan yazilmasin.
          KONU:                ${{ inputs.konu }}
        run: |
          # Zamanli calismada girdi yok; varsayilanlar burada.
          #
          # enfazla 25'ten 40'a cikti. Eski tavan gercek haberleri
          # disarida birakiyordu: bir calismada 25 adayin 14'u tek
          # kaynaktan gelen menu sayfalariydi ve o calismada hic haber
          # yazilmadi. Kaynak basina tavanla birlikte kontenjan artik
          # daha cok kaynaga dagiliyor.
          # Geriye bakis 6 saatten 30 saate cikti.
          #
          # Kaynak testi dar pencerenin ne kadar pahaliya mal oldugunu
          # gosterdi: MuhasebeTR beslemesinde 19, NTV'de 20 girdi var
          # ama 48 saatlik pencerede bile sifiri gosteriyorlar; 6 saatte
          # kaynaklarin cogu bos donuyor. Kaynaklar gun icinde duzensiz
          # yayin yapiyor ve iki saatlik araliklarla kosan bir ajan dar
          # pencereyle haberi kaciriyor.
          #
          # Genis pencere artik bedava: kopya denetimi dort katmanli ve
          # daha once gelen haber modele hic sorulmuyor. Onceden bu
          # pencereyi genisletmek ayni haberi tekrar tekrar yazdirmak
          # demekti; simdi degil.
          #
          # 22.10.2026: aday sayisi verilmezse ajan basliklarin paylarinin
          # toplamini kullaniyor (HaberAkisi::PAYLAR, 60); haberler baslik
          # baslik isleniyor.
          BAYRAKLAR="--saat=${{ inputs.saat || '30' }}"

          if [ -n "${{ inputs.enfazla }}" ]; then
            BAYRAKLAR="$BAYRAKLAR --enfazla=${{ inputs.enfazla }}"
          fi

          # Baslik secimi (panel: "Secili basligi topla"). Yalnizca
          # harf, rakam, tire ve virgul; kabuga baska bir sey gecmesin.
          if [ -n "$KONU" ] && [[ "$KONU" =~ ^[a-z0-9,-]+$ ]]; then
            BAYRAKLAR="$BAYRAKLAR --konu=$KONU"
          fi

          if [ "${{ inputs.kuru }}" = "true" ]; then
            BAYRAKLAR="$BAYRAKLAR --kuru"
          fi

          php topla.php $BAYRAKLAR

      # Siteye gonderilemeyen haberler: site bu eseri GitHub API'den
      # kendisi indiriyor (includes/ajan_teslim.php). GitHub'dan siteye
      # baglanti kurulamasa da ters yon calisiyor.
      - name: Gonderilemeyen haberleri GitHub'a birak
        if: ${{ !cancelled() && hashFiles('ajan/teslim/haberler.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: valentra-teslim
          path: ajan/teslim/haberler.json
          retention-days: 7
          if-no-files-found: ignore

      # "Valentra Diyor ki..." kose yazilari.
      #
      # Zamanli calismalarda her seferinde deneniyor ama gunde bir kez
      # yaziyor: saat 12'den once ya da bugunun yazilari zaten varsa
      # model cagrilmadan cikiyor (--zamanli). GitHub zamanli calismalarin
      # bir kismini dusurdugu icin tek bir saate baglanmadi. Haber
      # toplamadan SONRA: gunun yeni haberleri malzemeye girsin.
      # Yazilar taslak olarak gidiyor; yayina alma panelde.
      #
      # 'gunluk' (panel -> Gunluk isler): haber toplama + kose yazisi tek
      # calismada. Iki ayri istek gondermek ikincisini sirada bekletiyor,
      # ucuncu bir istek de bekleyeni iptal ediyordu.
      #
      # Kose yazilari 22.10.2026'da genel habere uyarlandi: gunun en
      # onemli haberlerinden (onem puani) ve en az biri dunyadan olmak
      # uzere yorum yazilari. Hepsi onaya duser.
      - name: Kose yazilarini yaz
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.mod == 'kose-yazisi' || inputs.mod == 'gunluk') }}
        working-directory: ajan
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:        ${{ secrets.GEMINI_MODEL }}
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
        run: |
          BAYRAKLAR=""

          if [ "${{ github.event_name }}" = "schedule" ]; then
            BAYRAKLAR="--zamanli"
          fi

          if [ "${{ inputs.kuru }}" = "true" ]; then
            BAYRAKLAR="$BAYRAKLAR --kuru"
          fi

          php kose.php $BAYRAKLAR

      # Grafik tazeleme ve Resmi Gazete fihristi adimlari kaldirildi
      # (22.10.2026): ana sayfada grafik yok, ajan yalnizca haber ve kose
      # yazisi uretiyor. Kurlar ve BIST serit verisini site kendisi cekiyor.

      # Google Search Console verisi. Veriyi SITE cekiyor (servis hesabi
      # anahtari panelde kayitli); site 20 saatten yeniyse hicbir sey yapmiyor,
      # yani gunde bes calisma tek bir cekime iniyor. Anahtar girilmemisse
      # sessizce atlaniyor.
      - name: Search Console verisini tazele
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.mod == 'topla' || inputs.mod == 'gunluk') }}
        env:
          VALENTRA_SITE_URL:  ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY: ${{ secrets.VALENTRA_AGENT_KEY }}
        run: |
          curl -sS --max-time 120 -X POST \
            -H "X-Valentra-Key: $VALENTRA_AGENT_KEY" \
            -H "Authorization: Bearer $VALENTRA_AGENT_KEY" \
            "${VALENTRA_SITE_URL%/}/api/gsc-tazele.php" \
            || { echo "::warning::Search Console tazeleme istegi basarisiz; panel acildiginda kendini tazeler."; \
                 echo "Search Console verisi tazelenemedi: siteye ulaşılamadı." >> "$AJAN_SORUN_DOSYASI"; }
          echo

      - name: Ajan deposunu kaydet
        if: ${{ always() && hashFiles('ajan/onbellek/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ajan/onbellek
          key: ajan-depo-${{ github.run_id }}-${{ github.run_attempt }}

      # Biriken sorunlari tek yerde, okunur bicimde gosterir ve calismayi
      # kirmizi bitirir. Her satir Actions ozetinde ve e-postada hata
      # olarak gorunur; panel de ayni satirlari GitHub'dan okuyup gosterir.
      - name: Sorunlari bildir
        if: always()
        run: |
          if [ ! -s "$AJAN_SORUN_DOSYASI" ]; then
            echo "Sorun yok."
            exit 0
          fi

          {
            echo "## Dikkat: yapılması gereken bir şey var"
            echo
            awk '!gorulen[$0]++' "$AJAN_SORUN_DOSYASI" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          awk '!gorulen[$0]++' "$AJAN_SORUN_DOSYASI" | while IFS= read -r satir; do
            satir="${satir//'%'/'%25'}"
            echo "::error title=Valentra ajanı::$satir"
          done

          exit 1
