name: Gecici hiz denetimi
on:
  push:
    branches: [denetim-olcum]
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Basliklar
        run: |
          o=""
          for u in / /assets/style.css /assets/ust-arka.webp /gorseller/haber/9a3c4a1107edc94d68b19526ac755108675da175-480.webp /assets/yazarlar/tekin-alp-sagduyulu.jpg; do
            h=$(curl -s -o /dev/null -D - -m 30 -H 'Accept-Encoding: gzip, br' "https://valentra.com.tr$u" | tr -d '\r' | grep -iE '^(cache-control|content-encoding|expires|content-type|server|x-powered-by|vary)' | tr '\n' ';')
            echo "::notice title=Başlık $u::$h"
          done
      - name: TTFB 2
        run: |
          h=$(curl -s -m 30 https://valentra.com.tr/ | grep -oE 'href="/haber/[^"]+"' | head -1 | cut -d'"' -f2)
          for u in "$h" /gundem /piyasalar /sirket /resmi-gazete /sitemap.xml; do
            a=""; for i in 1 2 3; do a="$a $(curl -s -o /dev/null -m 30 -w '%{time_starttransfer}' "https://valentra.com.tr$u")"; done
            echo "::notice title=TTFB $u::$a"
          done
          curl -s -o /dev/null -m 30 -w '%{size_download} sıkıştırmasız / ' https://valentra.com.tr/ > /tmp/a; curl -s --compressed -o /dev/null -m 30 -w '%{size_download} sıkıştırılmış(?)' -H 'Accept-Encoding: gzip' https://valentra.com.tr/ >> /tmp/a
          echo "::notice title=Ana sayfa boyut::$(cat /tmp/a)"
