name: Google denetimi

# Google tam denetimi (28.10.2026, site sahibinin istegi: "Google ile
# ilgili hicbir eksik kalmasin"). Denetimi SITE yapiyor: Search Console
# anahtari yalnizca sitede (api/google-denetim.php); bu is akisi
# sonucu ve PageSpeed Insights olcumunu kayda yaziyor. Hata varsa
# calisma kirmizi biter.
#
# Haber ajanindan AYRI is akisi: ajanin eszamanlilik grubunda sirada
# bekleyen haber calismasini iptal etmesin.

on:
  schedule:
    # Her pazartesi 10:17 (Turkiye saati).
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  group: valentra-google-denetim
  cancel-in-progress: true

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository kodlarini al
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ajan/google_denetim.php
            ajan/hiz_olcum.php
          sparse-checkout-cone-mode: false

      # Google'in hiz ve sayfa kalitesi olcumu (PageSpeed Insights'in
      # kullandigi Lighthouse). PSI'nin anahtarsiz ortak kotasi cogu gun
      # dolu oldugu icin ayni olcum burada, makinenin Chrome'uyla yapiliyor.
      - name: Lighthouse (mobil ve masaustu)
        if: ${{ !cancelled() }}
        env:
          VALENTRA_SITE_URL: ${{ secrets.VALENTRA_SITE_URL }}
        run: |
          site="${VALENTRA_SITE_URL%/}"
          for tur in mobil masaustu; do
            ek=""
            [ "$tur" = masaustu ] && ek="--preset=desktop"
            # JSON (olcum ve hiz_olcum.php icin) ve HTML (indirilip tarayicida acilacak rapor).
            npx -y lighthouse@12.8.2 "$site/" $ek --quiet --output=json --output=html --output-path="lh-$tur" \
              --only-categories=performance,seo,best-practices,accessibility \
              --chrome-flags="--headless=new --no-sandbox" || { echo "::warning::Lighthouse $tur calismadi"; continue; }
            mv "lh-$tur.report.json" "lh-$tur.json"; mv "lh-$tur.report.html" "lh-$tur.html"
            echo "== Lighthouse: $tur =="
            jq -r '.categories[] | "\(.title): \((.score*100)|round)"' "lh-$tur.json"
            jq -r '.audits | to_entries[] | select(.value.score != null and .value.score < 0.9
                   and (.value.scoreDisplayMode == "binary" or .value.scoreDisplayMode == "numeric" or .value.scoreDisplayMode == "metricSavings"))
                   | "  - \(.value.title)\(if .value.displayValue then " (" + .value.displayValue + ")" else "" end)"' "lh-$tur.json"
          done
          # Gecemeyen erisilebilirlik denetimlerinin hangi ogede takildigi
          # (or. "dokunma hedefi kucuk": hangi dugme, kac piksel).
          for tur in mobil masaustu; do
            [ -f "lh-$tur.json" ] || continue
            jq -r --arg tur "$tur" '.categories.accessibility.auditRefs[] as $r | .audits[$r.id] | select(.score == 0)
                   | "== Erisilebilirlik (\($tur)): \(.title)", (.details.items[]? | "  - \(.node.nodeLabel // "") | \(.node.selector // "") | \((.node.explanation // "") | gsub("\n"; " "))")' "lh-$tur.json" | head -60
          done
          # SAYFAYI NE ENGELLIYOR (20.11.2026, site sahibi: "raporu da kaydet"):
          # ucuncu taraflarin engelleme payi, en cok islemci tuketen betikler ve
          # uzun isler (baslangic ani dahil: 8. saniyedeki is ertelenmis betiktir).
          for tur in mobil masaustu; do
            [ -f "lh-$tur.json" ] || continue
            echo "== Engelleme dokumu ($tur) =="
            jq -r '"  Toplam engelleme: \(.audits["total-blocking-time"].displayValue // "-") · ana is parcacigi: \(.audits["mainthread-work-breakdown"].displayValue // "-") · sayfa boyutu: \(.audits["total-byte-weight"].displayValue // "-")"' "lh-$tur.json"
            echo "  -- Ucuncu taraflar (engelleme ms, aktarim KB):"
            jq -r '[.audits["third-party-summary"].details.items[]? ] | sort_by(-(.blockingTime // 0)) | .[:8][]
                   | "     \(.entity | if type == "object" then .text else . end): \((.blockingTime // 0) | round) ms, \(((.transferSize // 0) / 1024) | round) KB"' "lh-$tur.json"
            echo "  -- En cok islemci tuketen betikler (toplam / betik ms):"
            jq -r '[.audits["bootup-time"].details.items[]? ] | sort_by(-(.total // 0)) | .[:8][]
                   | "     \(.url | .[0:110]): \((.total // 0) | round) / \((.scripting // 0) | round)"' "lh-$tur.json"
            echo "  -- Uzun isler (baslangic ms, sure ms, kaynak):"
            jq -r '[.audits["long-tasks"].details.items[]? ] | sort_by(-(.duration // 0)) | .[:10][]
                   | "     \((.startTime // 0) | round) ms: \((.duration // 0) | round) ms · \(.url | .[0:100])"' "lh-$tur.json"
          done
          # Lighthouse robots.txt'yi gecersiz bulursa sebebini ve dosyanin canli halini goster.
          for tur in mobil masaustu; do
            [ -f "lh-$tur.json" ] || continue
            jq -r '.audits["robots-txt"].details.items[]? | "  robots.txt satir \(.index): \(.line) -> \(.message)"' "lh-$tur.json"
            break
          done
          echo "== Canli robots.txt =="
          curl -sS --max-time 20 "$site/robots.txt" | cat -A | head -60

      # Raporlari sakla (20.11.2026): calisma sayfasindaki "Artifacts" bolumunden
      # indirilir; lh-*.html tarayicida tam Lighthouse raporu olarak acilir.
      - name: Lighthouse raporlarini sakla
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-raporu
          path: |
            lh-mobil.html
            lh-masaustu.html
            lh-mobil.json
            lh-masaustu.json
          retention-days: 30
          if-no-files-found: ignore

      # Olcumu siteye yaz (08.11.2026): Lighthouse sonucu + PageSpeed
      # Insights gercek kullanici verisi (CrUX). Google tam denetiminin
      # "Hiz (Core Web Vitals)" bolumu bunu gosteriyor; bu yuzden denetimden once.
      - name: Hiz olcumunu siteye yaz
        if: ${{ !cancelled() }}
        env:
          VALENTRA_SITE_URL:  ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY: ${{ secrets.VALENTRA_AGENT_KEY }}
          PAGESPEED_API_KEY:  ${{ secrets.PAGESPEED_API_KEY }}
        run: php ajan/hiz_olcum.php || echo "::warning::Hiz olcumu siteye yazilamadi"

      - name: Google tam denetimi
        if: ${{ !cancelled() }}
        working-directory: ajan
        env:
          VALENTRA_SITE_URL:  ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY: ${{ secrets.VALENTRA_AGENT_KEY }}
        run: php google_denetim.php

