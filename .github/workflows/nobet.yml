name: Nobet taramasi

# Kritik haberler icin sik tarama (12.11.2026; bkz. ajan/topla.php --nobet,
# includes/oncelik.php).
#
# Site sahibinin istegi: "kritik ve dogrulanmis haberler normal yayin
# kuyrugunu beklemesin; kaynagin ilk aciklamasi ile sistemin taramasi
# arasindaki gecikme de olculsun."
#
# Neden gerekli: haber ajani iki saatte bir calisiyor. 12.11.2026'da
# Malatya'daki askeri helikopter kazasini kaynak 19.11'de duyurdu; onceki
# toplama 19.09'da bitmisti, haber ancak 21.01'deki toplamada goruldu ve
# 21.12'de siteye gitti: iki saat. Gecikmenin neredeyse tamami taramanin
# seyrekligiydi.
#
# Bu is akisi 15 dakikada bir gundem ve politika kaynaklarinin son bir
# saatini okur; sitede zaten olan basliklar elenir, kalan BASLIKLAR tek
# kucuk model isteginde on taramadan gecer. Kritik ya da yuksek oncelikli
# olabilecek aday yoksa (cogu zaman) is burada biter: haber yazilmaz, siteye
# bir sey gonderilmez. Varsa yalnizca o adaylar yazilir ve hemen gonderilir;
# site dogrulanmis kritik haberi aninda yayimlar, dogrulanmamisi panelde
# acil incelemeye alir. Olagan haberler iki saatlik toplamanin isi.
#
# Haber ajanindan AYRI eszamanlilik grubu: iki saatlik toplama 10-40 dakika
# suruyor; nobet onun bitmesini beklerse amacini yitirir. Ikisi ayni haberi
# yazarsa sitenin kopya denetimi ikincisini almaz.

on:
  schedule:
    # 15 dakikada bir; dakika 7'den baslar (saat basi GitHub'da yogun).
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

concurrency:
  group: valentra-nobet
  cancel-in-progress: false

jobs:
  nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository kodlarini al
        uses: actions/checkout@v5

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, simplexml, json, gd
          coverage: none

      - name: Composer onbellegi
        uses: actions/cache@v4
        with:
          path: ajan/vendor
          key: ajan-vendor-${{ hashFiles('ajan/composer.json') }}
          restore-keys: ajan-vendor-

      # Nobetin kendi kucuk deposu: modelin eledigi adaylar (ayni olayin
      # kopyalari, konu disi) hatirlanir, 15 dakika sonra yeniden okunmaz.
      # Haber ajaninin deposundan AYRI anahtar: oradaki "gonderilemeyen
      # haberler" kaydini ezmesin.
      - name: Nobet deposu
        uses: actions/cache/restore@v4
        with:
          path: ajan/onbellek
          key: nobet-depo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nobet-depo-

      - name: Bagimliliklari kur
        working-directory: ajan
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Nobet taramasi
        working-directory: ajan
        env:
          # Haber toplamayla ayni sira: once Claude, sonra Luna (Gemini kapali).
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:        ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:        ${{ secrets.CLAUDE_MODEL }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:        ${{ secrets.OPENAI_MODEL }}
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
        # --saat=2: bir saatlik pencere onceliklilerin cogunu "eski" diye eliyordu
        # (14.11.2026: 8 adayin 7'si); nobet seyrek calistiginda arada kalan haber kacmasin.
        run: php topla.php --nobet --saat=2 --konu=gundem,politika

      # Gorsel denetimi nobette de (13.11.2026): kayan mansete yalnizca
      # gorseli denetlenmis (uzerinde gazete/kanal/ajans adi olmayan) haber
      # giriyor (includes/manset_sinyal.php, manset_gorsel_durumu). Denetim
      # yalnizca iki saatlik toplamada kosarsa yeni haber mansete iki saat
      # gec girer. Bakilmamis gorsel yoksa adim hemen biter.
      - name: Gorsel denetimi
        if: ${{ !cancelled() }}
        working-directory: ajan
        env:
          VALENTRA_SITE_URL:   ${{ secrets.VALENTRA_SITE_URL }}
          VALENTRA_AGENT_KEY:  ${{ secrets.VALENTRA_AGENT_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:        ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:        ${{ secrets.CLAUDE_MODEL }}
        run: php gorsel_denetle.php --sure=3 || true

      - name: Nobet deposunu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ajan/onbellek
          key: nobet-depo-${{ github.run_id }}-${{ github.run_attempt }}
